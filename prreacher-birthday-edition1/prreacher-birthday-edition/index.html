<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070d">
  <link rel="icon" type="image/svg+xml" href="art/favicon.svg">
  <meta property="og:title" content="PRREACHER // 2K MMR EDITION">
  <meta property="og:description" content="A legendary birthday raid. One player. Two heroes. Zero map awareness.">
  <meta name="description" content="PRREACHER — 2K MMR EDITION. Кинематографическое поздравительное приключение в духе Dota 2 от Mashorka.">
  <title>PRREACHER // 2K MMR EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="ambient ambient-c" aria-hidden="true"></div>
  <div class="pointer-aura" aria-hidden="true"></div>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-screen="home" aria-label="На главную">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><b>PRREACHER</b><small>2K MMR // BIRTHDAY RAID</small></span>
      </button>
      <div class="server-status"><i></i><span>SERVER ONLINE</span><em>EU WEST · 322</em></div>
      <nav class="nav" aria-label="Основная навигация">
        <button data-screen="profile"><span class="nav-index">01</span>ПРОФИЛЬ</button>
        <button data-screen="achievements"><span class="nav-index">02</span>ТРОФЕИ</button>
        <button data-screen="settings"><span class="nav-index">03</span>НАСТРОЙКИ</button>
      </nav>
      <button class="sound-btn" id="soundToggle" aria-label="Включить или выключить звук"><span class="sound-bars"><i></i><i></i><i></i><i></i></span><span>ЗВУК</span></button>
    </header>
    <main id="screen" aria-live="polite"></main>
    <footer>
      <span class="footer-left"><b>PRREACHER // 2K MMR EDITION</b><i>UNOFFICIAL FAN-MADE EXPERIENCE</i></span>
      <span class="footer-center">MADE WITH QUESTIONABLE LOVE</span>
      <span class="footer-right">CREATED BY <b>MASHORKA</b><span class="footer-dot">◆</span> FOR THE ONE AND ONLY</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
